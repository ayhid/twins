version: 2
project_name: twins

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: twins
    main: ./cmd/twins
    binary: twins
    env:
      - CGO_ENABLED=1 # NSFileManager Trash backend
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/ayhid/twins/internal/cli.version={{.Version}}

universal_binaries:
  - replace: true

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
      order: 999

brews:
  - name: twins
    repository:
      owner: ayhid
      name: homebrew-tap
    homepage: https://github.com/ayhid/twins
    description: Find and remove duplicate files on macOS, safely
    license: MIT
    install: |
      bin.install "twins"
      generate_completions_from_executable(bin/"twins", "completion")
    test: |
      system "#{bin}/twins", "--version"
