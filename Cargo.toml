[workspace]
resolver = "3"
members = ["crates/twins-core", "crates/twins-cli"]

[workspace.package]
version = "1.0.0-beta.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ayhid/twins"
rust-version = "1.85"

[workspace.dependencies]
twins-core = { path = "crates/twins-core" }
anyhow = "1.0.104"
assert_cmd = "2.2.2"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
libc = "0.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
